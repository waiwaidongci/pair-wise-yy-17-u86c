<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>业务系统</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="topline">
        <div>
          <h1 id="title">业务系统</h1>
          <p class="lede" id="lede"></p>
        </div>
        <button class="secondary" id="refreshBtn">刷新数据</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="reviewOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
      <h2 id="reviewModalTitle">复查登记</h2>
      <div id="reviewBaseline"></div>
      <form id="reviewForm">
        <div class="form-grid" id="reviewFields"></div>
        <div class="actions">
          <button type="submit" id="reviewSubmit">提交复查</button>
          <button type="button" class="ghost" id="reviewCancel">取消</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
